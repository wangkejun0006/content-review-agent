name: Offline release verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev pytest -q
      - run: uv run --locked --extra dev ruff check smart_growth_agent tests scripts/local_runtime.py scripts/export_release.py scripts/audit_release.py scripts/offline_demo.py scripts/offline_e2e.py scripts/browser_acceptance.py
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm test --prefix frontend && npm run lint --prefix frontend && npm run build --prefix frontend
      - run: uv run --locked --extra dev python scripts/offline_demo.py --output .runtime/ci/rehearsal/report.json
      - run: uv run --locked --extra dev playwright install --with-deps chromium
      - name: Fresh PostgreSQL and API workflow
        run: |
          uv run --locked --extra dev python scripts/local_runtime.py setup --instance ci
          uv run --locked --extra dev python scripts/local_runtime.py serve --instance ci > /tmp/paper-orbit-ci-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8766/health/live && break || sleep 1; done
          uv run --locked --extra dev python scripts/offline_e2e.py --instance ci --output .runtime/ci/api/report.json
      - name: Browser rework approval and fictional feedback
        run: uv run --locked --extra dev python scripts/browser_acceptance.py --instance ci --output .runtime/ci/browser
      - run: uv run --locked --extra dev python scripts/audit_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-release-verification
          include-hidden-files: true
          path: .runtime/ci/
