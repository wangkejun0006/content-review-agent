[project]
name = "smart-growth-agent"
version = "0.1.0"
description = "Registry-first fictional content review and human approval workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<46",
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pypdf>=5.7,<6",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "openpyxl>=3.1,<4",
    "pillow>=11,<12",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "playwright==1.64.0",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
smart-growth-api = "smart_growth_agent.app.main:run"
smart-growth-worker = "smart_growth_agent.worker:run"
smart-growth-admin = "smart_growth_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smart_growth_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"] # FastAPI dependencies are intentionally declared as call defaults.
